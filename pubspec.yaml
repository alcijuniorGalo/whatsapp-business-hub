name: whatsapp_business_hub
description: Hub de operações multi-conta sobre a WhatsApp Business Cloud API (oficial Meta).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^17.2.3
  firebase_core: ^3.8.0
  firebase_messaging: ^15.2.0
  connectivity_plus: ^6.1.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.68.0
  share_plus: ^10.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
